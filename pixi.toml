[workspace]
authors = ["ben <ben.uzh@proton.me>"]
channels = ["conda-forge"]
name = "rapids-singlecell"
platforms = ["linux-64"]
version = "0.1.0"

# rapids-singlecell is published on PyPI (not on the rapidsai conda channel).
# NVIDIA's RAPIDS PyPI wheels bundle their own CUDA 13 runtime, so we don't need
# the rapidsai conda channel nor an explicit `cuda-version` pin here. The host
# driver must support CUDA 13.
#
# Since 0.15 the project ships native CUDA C++ extensions, and the plain
# `rapids-singlecell` dist is sdist-only — installing it forces a from-source
# build needing CUDA 13 nvcc + cmake + nanobind. Upstream publishes the built
# artifacts under CUDA-suffixed names instead, so we take `rapids-singlecell-cu13`
# (cp312-abi3 manylinux wheel). Its `rapids` extra pulls cudf/cuml/cugraph/cuvs-cu13;
# the package still imports as `rapids_singlecell`.
#
# Do not go back to 0.14.1: it imports `check_array` from
# `cuml.thirdparty_adapters`, which cuML removed by 26.06, so `import
# rapids_singlecell` fails outright against current cuML.
#
# Python is pinned to 3.13; 0.16.x accepts >=3.12,<3.15.

[dependencies]
python = ">=3.13,<3.14"
pip = "*"

[pypi-dependencies]
rapids-singlecell-cu13 = { version = "==0.16.1", extras = ["rapids"] }
obkit = ">=0.0.3, <0.0.4"
pytest = ">=8"

[tasks]
tests = "pytest tests/"
check = "python check.py"
validate = "python validators/pca_output.py"
export-env = "pixi workspace export conda-environment --name $(basename $(git rev-parse --show-toplevel)) envs/rapids-singlecell.yml && sed -i '1s/^/# this file was auto-generated by pixi - do not edit by hand\\n/' envs/rapids-singlecell.yml"

# env for quick dev tasks - avoid the GPU runtime deps
[feature.dev.dependencies]
python = ">=3.11"
pyyaml = ">=6"
curl = "*"

[feature.dev.tasks]
# refresh src/common/ (cli engine + stage schemas) from boilerplate + plan
sync = "sh -c 'curl -fsSL https://raw.githubusercontent.com/omni-scrna/boilerplate/${BRANCH:-main}/scripts/pull.py | python -'"

[environments]
dev = { features = ["dev"], no-default-feature = true }

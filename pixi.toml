[workspace]
authors = ["ben <ben.uzh@proton.me>"]
channels = ["conda-forge"]
name = "rapids-singlecell"
platforms = ["linux-64"]
version = "0.1.0"

# rapids-singlecell is published on PyPI (not on the rapidsai conda channel).
# NVIDIA's rapids13 PyPI wheels bundle their own CUDA 13 runtime via
# `cuda-toolkit==13.*`, so we don't need the rapidsai conda channel nor an
# explicit `cuda-version` pin here. The host driver must support CUDA 13.
#
# We pin to 0.14.1 (pure-Python wheel, py3-none-any) instead of 0.15.x because
# 0.15 added native CUDA C++ extensions and currently ships sdist-only on PyPI,
# which forces a from-source build that requires a matching CUDA 13 nvcc on
# PATH. Bump to 0.15.x once upstream publishes binary wheels.
#
# Python is pinned to 3.13 because 0.14.x metadata caps Python at <3.14.

[dependencies]
python = ">=3.13,<3.14"
pip = "*"

[pypi-dependencies]
rapids-singlecell = { version = "==0.14.1", extras = ["rapids13"] }
obkit = ">=0.0.3, <0.0.4"

[tasks]
check = "python check.py"
validate = "python validators/pca_output.py"
export-env = "pixi workspace export conda-environment --name $(basename $(git rev-parse --show-toplevel)) envs/rapids-singlecell.yml && sed -i '1s/^/# this file was auto-generated by pixi - do not edit by hand\\n/' envs/rapids-singlecell.yml"
